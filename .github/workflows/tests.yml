# Headless tests op Linux en Windows (#70, fasekader fase 2 T6; F5, R1, R18).
# Eigenaar: Tools Programmer. Uitleg: docs/tech/setup.md §6.
#
# Werkaanname: Godot 4.6.3-stable, officieel, standaard (niet mono), zoals
# vastgepind door de TD in docs/tech/setup.md §1 onder het CEO-besluit
# "Godot 4.6". Een andere patch = TD-besluit: pas GODOT_VERSION en beide
# hashes aan, uit SHA512-SUMS.txt van die release.
name: tests

on:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/tests.yml", ".github/ci/**"]
  pull_request:
    paths: ["game/**", ".github/workflows/tests.yml", ".github/ci/**"]
  # CEO-besluit 2026-11-13 "CI zuiniger": elke nacht de volledige matrix op main.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Een nieuwe push op dezelfde PR breekt de vorige PR-run af. Runs op main
# (push, nacht, met de hand) breken niets af: elke merge krijgt zijn eigen run.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.6.3"
  # Uit https://github.com/godotengine/godot/releases/download/4.6.3-stable/SHA512-SUMS.txt
  SHA512_LINUX: "a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c"
  SHA512_WINDOWS: "d44ea7ef5bab754cacd49d581b6062836b2eea12a82e1d183aebfad9cd8c7db2bd82513337bd657d6d2d5c04d46239c0570b029faf1343e81e8a2fa7b85dd83b"

jobs:
  tests:
    # #233 (TD): `kort` = alle testscripts behalve LANG_SCRIPTS (run_tests.gd)
    # plus de meta-run; `lang` = de lange scripted runs. Samen draaien ze
    # precies TEST_SCRIPTS.
    # CEO-besluit 2026-11-13 "CI zuiniger" (setup.md §6, besluit TD (a)):
    # - pull_request: alleen (linux, kort);
    # - push naar main, de nacht (schedule) en met de hand: alle vier
    #   (linux/windows x kort/lang). Geen test valt weg, alleen het moment.
    # De Windows-zip draait de console-variant: die geeft stdout en de
    # exitcode door.
    name: tests (${{ matrix.os }}, ${{ matrix.groep }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"linux","groep":"kort","runner":"ubuntu-24.04","zip":"linux.x86_64.zip","exe":"linux.x86_64","sha_var":"SHA512_LINUX"}]' || '[{"os":"linux","groep":"kort","runner":"ubuntu-24.04","zip":"linux.x86_64.zip","exe":"linux.x86_64","sha_var":"SHA512_LINUX"},{"os":"linux","groep":"lang","runner":"ubuntu-24.04","zip":"linux.x86_64.zip","exe":"linux.x86_64","sha_var":"SHA512_LINUX"},{"os":"windows","groep":"kort","runner":"windows-2022","zip":"win64.exe.zip","exe":"win64_console.exe","sha_var":"SHA512_WINDOWS"},{"os":"windows","groep":"lang","runner":"windows-2022","zip":"win64.exe.zip","exe":"win64_console.exe","sha_var":"SHA512_WINDOWS"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash   # ook op Windows (Git Bash); bash draait met -eo pipefail
    steps:
      - uses: actions/checkout@v7

      - name: Godot-download uit de cache
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.zip }}-${{ env[matrix.sha_var] }}

      - name: Godot downloaden (alleen zonder cache)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ZIP: Godot_v${{ env.GODOT_VERSION }}-stable_${{ matrix.zip }}
          EXPECTED: ${{ env[matrix.sha_var] }}
        run: |
          DL="$RUNNER_TEMP/godot-dl"
          mkdir -p "$DL" && cd "$DL"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o "$ZIP" "$BASE/$ZIP"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "$BASE/SHA512-SUMS.txt"
          # De vastgepinde hash moet gelijk zijn aan de officiële lijst.
          OFFICIAL=$(grep " $ZIP\$" SHA512-SUMS.txt | cut -d' ' -f1)
          if [ "$OFFICIAL" != "$EXPECTED" ]; then
            echo "::error::SHA-512 in de workflow wijkt af van SHA512-SUMS.txt ($OFFICIAL)"
            exit 1
          fi

      - name: SHA-512 controleren en uitpakken
        env:
          ZIP: Godot_v${{ env.GODOT_VERSION }}-stable_${{ matrix.zip }}
          EXE: Godot_v${{ env.GODOT_VERSION }}-stable_${{ matrix.exe }}
          EXPECTED: ${{ env[matrix.sha_var] }}
        run: |
          DL="$RUNNER_TEMP/godot-dl"
          # Elke run, ook bij een cache-hit: de zip moet de vastgepinde hash hebben.
          echo "$EXPECTED  $DL/$ZIP" | sha512sum -c -
          BIN="$RUNNER_TEMP/godot-bin"
          python3 -m zipfile -e "$DL/$ZIP" "$BIN" 2>/dev/null || python -m zipfile -e "$DL/$ZIP" "$BIN"
          chmod +x "$BIN/$EXE" || true
          echo "GODOT=$BIN/$EXE" >> "$GITHUB_ENV"
          "$BIN/$EXE" --headless --version

      - name: Importeren (headless)
        # #226 (TA): de kamerscènes van de Kadewijk verwijzen naar PNG's
        # (`game/art/wereld/kadewijk/`). Die vragen de importcache (`.godot/`),
        # en die staat niet in git; zonder deze stap faalt een verse clone.
        # Ontwerp R4: "zodra `game/` importeerbare assets krijgt, komt er een
        # `--import`-stap in CI". Een ERROR in de import, of een .import/.uid
        # in game/ die niet in git staat, maakt de job rood (besluit TD (c)).
        run: |
          "$GODOT" --headless --path game --import 2>&1 | tee import.log
          if grep -E '^(ERROR|SCRIPT ERROR):' import.log; then
            echo "::error::fout bij de import (zie import.log)"
            exit 1
          fi
          # Besluit TD (c): elk .import- en .uid-bestand staat in git.
          NEW=$(git status --porcelain --untracked-files=all -- game | grep '^??' || true); [ -z "$NEW" ] || { echo "$NEW"; echo "::error::.import/.uid niet gecommit"; exit 1; }

      - name: Tests (headless, groep ${{ matrix.groep }})
        run: |
          "$GODOT" --headless --path game --fixed-fps 60 -s res://tests/run_tests.gd -- --groep=${{ matrix.groep }} 2>&1 | tee tests.log
          # #233: een lek bij het afsluiten (een RefCounted-kring, een node die
          # niet vrijkomt) maakt de job rood. Details: dezelfde run met --verbose.
          if grep -E 'resources still in use at exit|ObjectDB instances leaked at exit' tests.log; then
            echo "::error::lek bij afsluiten (draai lokaal met --verbose voor de bron)"
            exit 1
          fi

      - name: Meta-run (kapotte tests moeten de suite rood maken)
        if: matrix.groep == 'kort'
        # ontwerp.md §9 en R18: bewijst dat de runner een scriptfout, een test
        # met 0 checks en (#82) een parse-fout in een script waar een test van
        # afhangt als FAIL telt en exitcode 1 geeft. Die laatste moet de
        # scriptcontrole vóór de eerste test melden.
        # Verwacht 5 FAIL's: 2 in de scriptcontrole (meta_broken_dep.gd en
        # test_meta_broken_dep.gd), 2 tests in test_meta_broken.gd, en
        # test_meta_broken_dep.gd dat in de testlus niet laadt.
        # #233: de testlus draait alleen de twee meta-scripts (`--scripts=`);
        # de scriptcontrole laadt nog steeds elk script.
        run: |
          META="test_meta_broken.gd meta_broken_dep.gd test_meta_broken_dep.gd"
          for f in $META; do cp ".github/ci/$f" game/tests/; done
          set +e
          "$GODOT" --headless --path game --fixed-fps 60 -s res://tests/run_tests.gd -- --scripts=res://tests/test_meta_broken.gd,res://tests/test_meta_broken_dep.gd > meta.log 2>&1
          CODE=$?
          set -e
          for f in $META; do rm "game/tests/$f"; done
          grep -E 'FAIL (test_meta_|res://tests/(test_)?meta_|script laadt niet)|Resultaat' meta.log
          [ "$CODE" -eq 1 ] || { echo "::error::meta-run gaf exitcode $CODE, verwacht 1"; exit 1; }
          grep -q 'FAIL test_meta_script_error_must_fail' meta.log || { echo "::error::scriptfout niet als FAIL geteld"; exit 1; }
          grep -q 'FAIL test_meta_zero_checks_must_fail' meta.log || { echo "::error::0 checks niet als FAIL geteld"; exit 1; }
          # Alles vóór de kop van het eerste testscript is de scriptcontrole.
          awk '/^res:\/\/tests\//{exit} {print}' meta.log > meta_voor_tests.log
          grep -q 'FAIL res://tests/meta_broken_dep.gd laadt niet' meta_voor_tests.log || { echo "::error::parse-fout in een afhankelijk script niet vóór de eerste test als FAIL gemeld"; exit 1; }
          grep -q 'groep --scripts: 2 van' meta.log || { echo "::error::meta-run draaide niet precies de 2 meta-scripts"; exit 1; }
          grep -q ' 5 mislukt' meta.log || { echo "::error::verwacht precies 5 mislukte tests"; exit 1; }
          echo "Meta-run OK: runner geeft FAIL en exitcode 1"

      - name: Uitvoer bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testuitvoer-${{ matrix.os }}-${{ matrix.groep }}
          path: |
            import.log
            tests.log
            meta.log
          if-no-files-found: ignore
          retention-days: 14
